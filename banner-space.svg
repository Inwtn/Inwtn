<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Almeida — Event Horizon</title>
  <desc id="desc">Banner espacial em preto e prata com um horizonte de eventos à direita e a apresentação de Isaac Almeida à esquerda.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506" stop-opacity=".98"/>
      <stop offset=".38" stop-color="#050506" stop-opacity=".76"/>
      <stop offset=".60" stop-color="#050506" stop-opacity=".14"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D4D7" stop-opacity=".8"/>
      <stop offset="1" stop-color="#D8D4D7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#050506"/>
  <image href="event-horizon.png" x="487" y="0" width="712" height="400" preserveAspectRatio="xMidYMid meet"/>
  <rect width="1200" height="400" fill="url(#veil)"/>
  <path d="M48 44H159M48 44V72" fill="none" stroke="#DCD8DC" stroke-opacity=".76" stroke-width="1"/>
  <circle cx="48" cy="44" r="2.4" fill="#FFD735"/>
  <text x="73" y="71" fill="#C6C2C8" font-family="Consolas,monospace" font-size="12" letter-spacing="3">ISAAC ALMEIDA  /  EVENT HORIZON</text>
  <text x="71" y="174" fill="#F1EEE9" font-family="Segoe UI,Arial,sans-serif" font-size="81" font-weight="300" letter-spacing="-4">Isaac</text>
  <text x="71" y="251" fill="#F1EEE9" font-family="Segoe UI,Arial,sans-serif" font-size="81" font-weight="300" letter-spacing="-4">Almeida</text>
  <path d="M74 272H505" stroke="url(#orbit)" stroke-width="1"/>
  <text x="73" y="305" fill="#CEC9D0" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing=".5">Software Engineer · Brazil</text>
  <text x="73" y="332" fill="#9E9AA5" font-family="Consolas,monospace" font-size="12" letter-spacing="1.3">ENGINEERING CONNECTIONS</text>
  <path d="M48 359H83" stroke="#FFD735" stroke-width="2"/>
  <text x="96" y="364" fill="#D8D3DB" font-family="Consolas,monospace" font-size="11" letter-spacing="2">EXPLORE THE PORTFOLIO  ↗</text>
  <circle cx="441" cy="84" r="1" fill="#D4CFD9" opacity=".55"/>
  <circle cx="392" cy="215" r="1.2" fill="#D4CFD9" opacity=".38"/>
  <circle cx="551" cy="348" r=".8" fill="#D4CFD9" opacity=".45"/>
</svg>
