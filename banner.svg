<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Almeida — Software Engineer</title>
  <desc id="desc">Banner original com fotografia abstrata em grafite, iluminação neon amarela e tipografia editorial.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#07090B" stop-opacity=".85"/><stop offset=".48" stop-color="#07090B" stop-opacity=".58"/><stop offset=".76" stop-color="#07090B" stop-opacity=".04"/><stop offset="1" stop-color="#07090B" stop-opacity="0"/></linearGradient>
